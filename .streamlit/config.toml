# The console commits deliberately to a dark mission-control look; the palette
# in ui/theme.py uses the dark column throughout and was validated against
# this surface.
[theme]
base = "dark"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#ffffff"
primaryColor = "#3987e5"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
