# Build the site from source and publish it to GitHub Pages.
#
# The site is BUILT here, not committed. Pages deploys an uploaded artifact
# rather than a branch, so the workflow can regenerate site/data on every run
# and never store it in git. That matters for a weekly schedule: committing
# ~7 MB of regenerated payloads every refresh would add well over 100 MB a year
# to the repository, and the history would be data churn rather than code.
#
# It also makes the deployed site strictly more trustworthy — it is always the
# output of the pipeline the test suite covers, never a committed snapshot that
# has quietly drifted from it.
#
# Nothing is cached deliberately. The connectors cache downloads by filename
# without a version in the key, so a warm cache would keep serving an old
# AlphaFold model release forever — exactly the staleness this schedule exists
# to prevent. A cold fetch each run costs a few minutes and is always correct.

name: Build and deploy site

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'SPEC.md'
      - '.gitignore'
  schedule:
    # ClinVar publishes its weekly archive midweek (the release this was built
    # against was dated a Wednesday), so run Thursday morning UTC to pick it up.
    - cron: '0 6 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true          # python deps only, never the data cache

      - name: Build the ontology from public sources
        run: uv run python ingest.py

      - name: Generate the site
        run: uv run python export_site.py

      - name: Verify the rules still hold
        # A scheduled build runs unattended, so the gates matter more here than
        # locally: upstream data can change in ways that break an invariant, and
        # a failed run leaves the previous deployment live rather than shipping
        # something wrong.
        run: |
          uv run --with pytest pytest -q
          uv run python validate_phase1.py
          uv run python validate_phase2.py
          uv run python audit_site.py

      - name: Report what this build is standing on
        run: |
          uv run python -c "
          import json, pathlib
          m = json.loads(pathlib.Path('site/data/manifest.json').read_text())
          print('built      ', m['generated_at'])
          for k, v in (m.get('sources') or {}).items():
              print(f'{k:<20} {v}')
          print('targets    ', ', '.join(t['symbol'] for t in m['targets']))
          print('predictions', sum(t['kpi']['predictions'] for t in m['targets']))
          " >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
